name: Build BOSS777 Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK File
        run: |
          cordova create boss777_app com.boss777.app "BOSS777"
          rm -rf boss777_app/www/*
          cp -r index.html style.css script.js logo.png boss777_app/www/
          cd boss777_app
          cordova platform add android@12.0.0
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOSS777-Official-APK
          path: boss777_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
