name: Build BOSS777 Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: PWABuilder Android Action
        uses: pwa-builder/pwabuilder-android-crash-action@v1.0.1
        with:
          pwa-url: 'https://pavankalal102-maker.github.io/BOSS777/'
          package-name: 'com.boss777.app'
          app-name: 'BOSS777'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOSS777-Official-APK
          path: ./*-debug.apk
